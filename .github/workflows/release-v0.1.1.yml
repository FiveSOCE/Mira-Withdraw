name: Release v0.1.1

on:
  push:
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 build/libs/MiraWithdraw-0.1.1.jar \
            --target "${GITHUB_SHA}" \
            --title "MiraWithdraw v0.1.1" \
            --notes "Polishes withdrawal pouches with formatted gold names, simplified pouch lore, grouped currency formatting and XP-orb pickup audio feedback on successful withdrawal and redemption."
